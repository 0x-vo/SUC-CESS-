<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Digital Success Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0d1b2a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Georgia', serif;
      color: #2b2b2b;
      overflow: hidden;
      position: relative;
    }

    /* Screen Frame & Background */
    .outer-frame {
      position: absolute;
      inset: 0;
      border: 18px solid #0f2338;
      pointer-events: none;
      z-index: 1000;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    .screen-header {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: #e5c158;
      font-size: 1.1rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .screen-header::before, .screen-header::after {
      content: '🌿';
      font-size: 0.9rem;
    }

    .stars-bg {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 230px 190px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 400px 400px;
      opacity: 0.3;
      pointer-events: none;
    }

    /* Outer Botanical Accents */
    .botanical-border {
      position: absolute;
      pointer-events: none;
      z-index: 10;
    }

    .botanical-top-left { top: 10px; left: 10px; width: 320px; height: 320px; }
    .botanical-top-right { top: 10px; right: 10px; width: 320px; height: 320px; transform: scaleX(-1); }
    .botanical-bottom-left { bottom: 10px; left: 10px; width: 320px; height: 320px; transform: scaleY(-1); }
    .botanical-bottom-right { bottom: 10px; right: 10px; width: 320px; height: 320px; transform: scale(-1, -1); }

    /* Scene Perspective */
    .scene {
      width: 700px;
      height: 460px;
      perspective: 2000px;
      position: relative;
      z-index: 20;
    }

    /* Book Container */
    .book {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .book.closed-front { transform: translateX(-25%); }
    .book.closed-back { transform: translateX(25%); }
    .book.is-open { transform: translateX(0); }

    /* Spine */
    .spine {
      position: absolute;
      left: 50%;
      top: 0;
      width: 18px;
      height: 100%;
      background: linear-gradient(to right, #201309, #54391e, #1a0f07);
      transform: translateX(-50%);
      z-index: 500;
      border-radius: 2px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .book.is-open .spine { opacity: 1; }

    /* Base Spread Layers */
    .book-base {
      position: absolute;
      width: 50%;
      height: 100%;
      background: #f8f4ec;
      top: 0;
      border-radius: 4px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .book.is-open .book-base { opacity: 1; }

    .book-base.left {
      left: 0;
      border-radius: 6px 0 0 6px;
      border-left: 6px solid #3d2d1d;
    }

    .book-base.right {
      right: 0;
      border-radius: 0 6px 6px 0;
      border-right: 6px solid #3d2d1d;
    }

    /* Pages Setup */
    .page {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1.4s cubic-bezier(0.645, 0.045, 0.355, 1);
    }

    .page-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #fdfbf7;
      border: 1px solid #e2dacd;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.02);
      border-radius: 0 6px 6px 0;
      overflow: hidden;
    }

    .page-back {
      transform: rotateY(180deg);
      border-radius: 6px 0 0 6px;
    }

    .page.flipped { transform: rotateY(-180deg); }

    /* Image Container Pages - Full Bleed */
    .embedded-page-image {
      padding: 0 !important;
      margin: 0 !important;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      border: none;
    }

    /* Full-bleed image fitting */
    .embedded-page-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Z-Index Structure */
    #front-cover { z-index: 100; }
    #leaf1       { z-index: 30; }
    #leaf2       { z-index: 20; }
    #back-cover  { z-index: 10; }

    #front-cover.flipped { z-index: 10; }
    #leaf1.flipped       { z-index: 20; }
    #leaf2.flipped       { z-index: 30; }
    #back-cover.flipped  { z-index: 40; }

    /* Cover Styling */
    .cover-front-style {
      background: linear-gradient(145deg, #382314 0%, #1a0d05 100%);
      color: #f4e8c1;
      border: 3px solid #63472b;
      box-shadow: 0 20px 45px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px 20px;
      border-radius: 0 6px 6px 0;
    }

    .cover-border-box {
      position: absolute;
      inset: 10px;
      border: 1px solid #c29b38;
      pointer-events: none;
      border-radius: 3px;
    }

    .cover-border-box::before {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px dashed #7a5c28;
    }

    .cover-title {
      font-size: 2rem;
      color: #e5c158;
      margin-bottom: 12px;
      font-weight: normal;
      letter-spacing: 1px;
    }

    .cover-subtitle {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #d8c29d;
      margin-bottom: 25px;
      font-style: italic;
      max-width: 240px;
    }

    .btn-action {
      padding: 10px 24px;
      background: transparent;
      color: #e5c158;
      border: 1.5px solid #e5c158;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .btn-action:hover {
      background: #e5c158;
      color: #1a0d05;
      box-shadow: 0 0 15px rgba(229, 193, 88, 0.4);
    }

    .controls {
      position: relative;
      margin-top: 25px;
      z-index: 100;
      display: flex;
      gap: 12px;
    }

    .nav-btn {
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid #3d4f73;
      background: #101a2e;
      color: #e5c158;
      cursor: pointer;
      font-size: 0.8rem;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      background: #e5c158;
      color: #0d1b2a;
    }
  </style>
</head>
<body>

  <!-- Background Audio File -->
  <audio id="card-audio" src="bg-music.mp3" loop preload="auto"></audio>

  <div class="outer-frame"></div>
  <div class="stars-bg"></div>
  <div class="screen-header">A Special Message</div>

  <!-- Botanical Accents -->
  <svg class="botanical-border botanical-top-left" viewBox="0 0 200 200">
    <path d="M 10 200 C 10 80, 80 10, 200 10" fill="none" stroke="#3a5a40" stroke-width="4"/>
    <path d="M 20 200 C 20 90, 90 20, 200 20" fill="none" stroke="#d4af37" stroke-width="1.5"/>
    <circle cx="50" cy="80" r="12" fill="#e8a598"/>
    <circle cx="120" cy="35" r="16" fill="#f4acb7"/>
    <circle cx="170" cy="20" r="10" fill="#eae2b7"/>
  </svg>

  <svg class="botanical-border botanical-top-right" viewBox="0 0 200 200">
    <path d="M 10 200 C 10 80, 80 10, 200 10" fill="none" stroke="#3a5a40" stroke-width="4"/>
    <path d="M 20 200 C 20 90, 90 20, 200 20" fill="none" stroke="#d4af37" stroke-width="1.5"/>
    <circle cx="50" cy="80" r="12" fill="#e8a598"/>
    <circle cx="120" cy="35" r="16" fill="#f4acb7"/>
    <circle cx="170" cy="20" r="10" fill="#eae2b7"/>
  </svg>

  <svg class="botanical-border botanical-bottom-left" viewBox="0 0 200 200">
    <path d="M 10 200 C 10 80, 80 10, 200 10" fill="none" stroke="#3a5a40" stroke-width="4"/>
    <path d="M 20 200 C 20 90, 90 20, 200 20" fill="none" stroke="#d4af37" stroke-width="1.5"/>
    <circle cx="50" cy="80" r="12" fill="#e8a598"/>
    <circle cx="120" cy="35" r="16" fill="#f4acb7"/>
    <circle cx="170" cy="20" r="10" fill="#eae2b7"/>
  </svg>

  <svg class="botanical-border botanical-bottom-right" viewBox="0 0 200 200">
    <path d="M 10 200 C 10 80, 80 10, 200 10" fill="none" stroke="#3a5a40" stroke-width="4"/>
    <path d="M 20 200 C 20 90, 90 20, 200 20" fill="none" stroke="#d4af37" stroke-width="1.5"/>
    <circle cx="50" cy="80" r="12" fill="#e8a598"/>
    <circle cx="120" cy="35" r="16" fill="#f4acb7"/>
    <circle cx="170" cy="20" r="10" fill="#eae2b7"/>
  </svg>

  <div class="scene">
    <div class="book closed-front" id="book">
      <div class="spine"></div>

      <!-- Static Base Layers -->
      <div class="book-base left"></div>
      <div class="book-base right"></div>

      <!-- 1. FRONT COVER LEAF -->
      <div class="page" id="front-cover">
        <div class="page-face cover-front-style">
          <div class="cover-border-box"></div>
          <div style="font-size: 1.2rem; margin-bottom: 10px;">🌸 🌿 🌸</div>
          <div class="cover-title">For Alice</div>
          <p class="cover-subtitle">A little note of strength and encouragement before your final exams.</p>
          <button class="btn-action" onclick="openBook()">Open Card</button>
        </div>

        <!-- INSIDE COVER IMAGE LINK -->
        <div class="page-face page-back embedded-page-image">
          <img src="inside-cover.png" alt="Inside Cover" />
        </div>
      </div>

      <!-- 2. INTERNAL LEAF 1 (Pages 1 & 2) -->
      <div class="page" id="leaf1" onclick="turnToSecondSpread()">
        <!-- PAGE 1 IMAGE -->
        <div class="page-face embedded-page-image">
          <img src="page1-tech.png" alt="Page 1" />
        </div>
        
        <!-- PAGE 2 IMAGE -->
        <div class="page-face page-back embedded-page-image">
          <img src="page2-goodluck.png" alt="Page 2" />
        </div>
      </div>

      <!-- 3. INTERNAL LEAF 2 (Pages 3 & 4) -->
      <div class="page" id="leaf2" onclick="closeToBackCover()">
        <!-- PAGE 3 IMAGE -->
        <div class="page-face embedded-page-image">
          <img src="page3-note.png" alt="Page 3" />
        </div>

        <div class="page-face page-back cover-front-style">
          <div class="cover-border-box"></div>
          <div class="cover-title" style="font-size: 1.5rem;">All the Best!</div>
          <p class="cover-subtitle" style="margin-bottom: 20px;">May clarity, focus, and success be with you in every subject.</p>
        </div>
      </div>

      <!-- 4. BACK COVER LEAF -->
      <div class="page" id="back-cover">
        <div class="page-face"></div>
        <div class="page-face page-back cover-front-style">
          <div class="cover-border-box"></div>
          <div class="cover-title" style="font-size: 1.6rem;">You've Got This, Alice!</div>
          <p class="cover-subtitle" style="margin-bottom: 20px;">Wishing you total success in your final examinations.</p>
          <button class="btn-action" onclick="restartCard()">Reopen Card</button>
        </div>
      </div>

    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="audio-toggle-btn" onclick="toggleAudio()">🔊 Pause Music</button>
    <button class="nav-btn" onclick="restartCard()">Reset Card</button>
  </div>

  <script>
    const book = document.getElementById('book');
    const frontCover = document.getElementById('front-cover');
    const leaf1 = document.getElementById('leaf1');
    const leaf2 = document.getElementById('leaf2');
    const backCover = document.getElementById('back-cover');
    const audio = document.getElementById('card-audio');
    const audioBtn = document.getElementById('audio-toggle-btn');

    function playAudio() {
      if (audio.paused) {
        audio.play().then(() => {
          audioBtn.innerText = "🔊 Pause Music";
        }).catch(err => {
          console.log("Audio playback waiting for interaction: ", err);
        });
      }
    }

    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        audioBtn.innerText = "🔊 Pause Music";
      } else {
        audio.pause();
        audioBtn.innerText = "意识 Play Music";
      }
    }

    function openBook() {
      playAudio();
      book.classList.remove('closed-front', 'closed-back');
      book.classList.add('is-open');
      frontCover.classList.add('flipped');
    }

    function turnToSecondSpread() {
      if (!frontCover.classList.contains('flipped')) return;
      leaf1.classList.add('flipped');
    }

    function closeToBackCover() {
      if (!leaf1.classList.contains('flipped')) return;
      
      leaf2.classList.add('flipped');
      backCover.classList.add('flipped');

      setTimeout(() => {
        book.classList.remove('is-open');
        book.classList.add('closed-back');
      }, 700);
    }

    function restartCard() {
      book.classList.remove('is-open', 'closed-back');
      book.classList.add('closed-front');

      frontCover.classList.remove('flipped');
      leaf1.classList.remove('flipped');
      leaf2.classList.remove('flipped');
      backCover.classList.remove('flipped');
    }
  </script>
</body>
</html>
